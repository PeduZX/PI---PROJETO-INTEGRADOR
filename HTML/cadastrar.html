  <main>
    <div id="container">
      <div id="container-form">
        <form>
          <h2 style="text-align: center;">Cadastrar-se</h2>
          <label for="">Nome:</label>
          <input id="input-nome" type="text" placeholder="Nome">
          <label for="">Email:</label>
          <input id="input-email" type="text" placeholder="Email">
          <label for="">Data De Nascimento:</label>
          <input id="input-data" type="date" placeholder="dd/mm/aaaa">
          <label for="">Senha:</label>
          <input id="input-senha" type="password" placeholder="Ex: 1234">
          <label for="">Ser Mentorado em:</label>
          <select id="select-mentorado" class="select-area">
            <option value="Ciencias Humanas">Ciências Humanas</option>
            <option value="Ciencias Da natureza">Ciências da Natureza</option>
            <option value="Linguagens">Linguagens</option>
            <option value="Exatas">Exatas</option>
            <option value="Só quero ajudar">Só quero ajudar</option>
          </select>

          <label for="">Mentorar em:</label>
          <select id="select-mentorar" class="select-area">
            <option value="Ciencias Humanas">Ciências Humanas</option>
            <option value="Ciencias Da natureza">Ciências da Natureza</option>
            <option value="Linguagens">Linguagens</option>
            <option value="Exatas">Exatas</option>
            <option value="Só quero ser ajudado">Só quero ser ajudado</option>
          </select>

          <button id="btn-cadastrar" type="button">Cadastrar</button>
          <a id="a-login" href="login.html">Já tenho conta</a>
          <p style="text-align: center;" id="msg"></p>

        </form>
      </div>
    </div>

    </div>
